# =============================================================================
# Kovai-Trans Production Docker Compose
# =============================================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop all services
#   docker-compose exec app bash  # Shell into app container
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: kovai-trans-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kovai_transport}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Laravel Application (PHP-FPM + Nginx + Node.js WhatsApp Service)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kovai-trans-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
      - whatsapp_auth:/var/www/html/node-services/whatsapp-baileys/auth_info
    ports:
      - "${APP_PORT_EXTERNAL:-80}:80"

  # ---------------------------------------------------------------------------
  # Laravel Scheduler (runs cron jobs)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kovai-trans-scheduler
    restart: unless-stopped
    depends_on:
      - app
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap:/var/www/html/bootstrap/cache
    command: >
      sh -c "echo '* * * * * cd /var/www/html && php artisan schedule:run >> /dev/null 2>&1' > /etc/crontabs/root &&
             crond -f -l 8"

  # ---------------------------------------------------------------------------
  # WhatsApp Baileys Node.js Service
  # ---------------------------------------------------------------------------
  whatsapp:
    image: node:20-alpine
    container_name: kovai-trans-whatsapp
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./node-services/whatsapp-baileys:/app
      - whatsapp_auth:/app/auth_info
    ports:
      - "${WHATSAPP_PORT_EXTERNAL:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  app_storage:
    driver: local
  app_bootstrap:
    driver: local
  whatsapp_auth:
    driver: local
