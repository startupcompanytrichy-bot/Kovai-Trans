# =============================================================================
# Supervisor Configuration for Laravel Production
# Manages: PHP-FPM, Nginx, Queue Worker, Scheduler
# =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid

# ---------------------------------------------------------------------------
# PHP-FPM Process Manager
# ---------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---------------------------------------------------------------------------
# Nginx Web Server
# ---------------------------------------------------------------------------
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---------------------------------------------------------------------------
# Laravel Queue Worker
# ---------------------------------------------------------------------------
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---------------------------------------------------------------------------
# Laravel Scheduler (runs every minute via a loop)
# ---------------------------------------------------------------------------
[program:scheduler]
command=sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---------------------------------------------------------------------------
# WhatsApp Baileys Node.js Service
# ---------------------------------------------------------------------------
[program:baileys]
command=node /var/www/html/node-services/whatsapp-baileys/server.js
directory=/var/www/html/node-services/whatsapp-baileys
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
